<!-- Stacked on phones: at 23% the level list was a sliver ("10 / 20 / Ac"). -->
<div class="grid grid-cols-1 md:grid-cols-[23%_1fr] gap-4 h-full">
  <app-results-list (viewSessionResultEvent)="viewResult($event)" />

  <div class="grid lg:grid-cols-[1fr_22%] grid-cols-1 gap-4 h-full">
    <app-result-view
      [results]="preview()"
      [gpa]="GPA()"
      [semester]="semester()"
      [loading]="loading()"
    />
    <app-result-preview
      [studentResults]="results()"
      [semester]="semester()"
      (semsterEvent)="getSemesterResult($event)"
    />
  </div>
</div>
