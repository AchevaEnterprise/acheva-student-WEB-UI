<app-side-bar (toggleSideNav)="onToggleSideNav($event)" />

<div
  class="w-[calc(100%_-_5rem)] h-[100vh] overflow-hidden ml-[5rem] z-0 relative top-0 bg-[#f4f7fa] transition-all duration-300 ease-in-out"
  [class]="getBodyClass()"
>
  <app-tool-bar />

  <!-- A column, not a scrolling block: the banner takes the height it needs
       and the routed page gets the rest. A page that scrolls internally (the
       chat) can then fill exactly what is left, instead of being pushed past
       the bottom by whatever the banner happens to be showing today. -->
  <div class="layout__content" [class.layout__content--full-bleed]="fullBleed()">
    <app-account-status-banner />
    <div class="layout__outlet">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
